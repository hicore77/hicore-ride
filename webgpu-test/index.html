<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hicore Ride WebGPU-Test</title>
<style>
  :root{ --bg:#0f141b; --panel:rgba(14,19,26,.78); --fg:#eef2f6; --mut:#9aa7b4; --acc:#ff406e; --ok:#3ccf8e; --warn:#f2b33d; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif; overflow:hidden; -webkit-user-select:none; user-select:none; }
  canvas{ display:block; width:100vw; height:100vh; touch-action:none; }
  #hud{ position:fixed; left:max(10px,env(safe-area-inset-left)); top:max(10px,env(safe-area-inset-top)); background:var(--panel); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:12px; padding:10px 12px; min-width:190px; font-variant-numeric:tabular-nums; }
  #hud .big{ font-size:26px; font-weight:700; }
  #hud .row{ display:flex; justify-content:space-between; gap:14px; color:var(--mut); font-size:12.5px; }
  #hud .row b{ color:var(--fg); font-weight:600; }
  .tag{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:700; margin-left:6px; vertical-align:middle; }
  #bar{ position:fixed; right:max(10px,env(safe-area-inset-right)); top:max(10px,env(safe-area-inset-top)); display:flex; flex-direction:column; gap:8px; align-items:stretch; width:min(220px,46vw); }
  #bar select,#bar button{ font:inherit; color:var(--fg); background:var(--panel); border:1px solid rgba(255,255,255,.14); border-radius:10px; padding:9px 10px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #bar button.on{ border-color:var(--acc); }
  #bar label{ font-size:12px; color:var(--mut); background:var(--panel); border-radius:10px; padding:6px 10px; }
  #bar input[type=range]{ width:100%; }
  #res{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(14,19,26,.94); border-radius:14px; padding:18px 20px; width:min(420px,88vw); display:none; }
  #res h2{ margin:0 0 8px; font-size:18px; }
  #res pre{ white-space:pre-wrap; font-size:13px; background:rgba(255,255,255,.06); padding:10px; border-radius:8px; margin:8px 0 12px; }
  #res button{ font:inherit; color:var(--fg); background:#26303c; border:0; border-radius:8px; padding:8px 14px; margin-right:6px; }
  #load{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:radial-gradient(circle at 50% 40%,#1c2a3a,#0b0f14); z-index:5; }
  #load .t{ font-size:20px; font-weight:700; letter-spacing:.02em; }
  #load .b{ width:min(320px,70vw); height:6px; background:#ffffff1c; border-radius:6px; overflow:hidden; }
  #load .b i{ display:block; height:100%; width:0; background:var(--acc); transition:width .2s; }
  #load .s{ color:var(--mut); font-size:13px; }
  #bm{ position:fixed; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--panel); padding:8px 14px; border-radius:20px; display:none; font-weight:600; }
  @media (max-width:560px){ #hud{ min-width:150px; padding:8px 10px; } #hud .big{ font-size:21px; } #bar select,#bar button{ padding:7px 8px; font-size:13px; } }
</style>
</head>
<body>
<div id="load"><div class="t">Hicore Ride · WebGPU-Testwelt</div><div class="b"><i id="lbar"></i></div><div class="s" id="lmsg">Starte…</div></div>
<div id="hud">
  <div><span class="big" id="fps">–</span> <span style="color:var(--mut)">FPS</span><span class="tag" id="be">…</span></div>
  <div class="row"><span>Frame</span><b id="ms">–</b></div>
  <div class="row"><span>Dreiecke</span><b id="tri">–</b></div>
  <div class="row"><span>Draw Calls</span><b id="dc">–</b></div>
  <div class="row"><span>Auflösung</span><b id="rs">–</b></div>
  <div class="row"><span>Qualität</span><b id="ql">–</b></div>
  <div class="row"><span>Ladezeit</span><b id="lt">–</b></div>
  <div class="row" style="max-width:240px"><span>GPU</span><b id="gpu" style="text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px">–</b></div>
</div>
<div id="bar">
  <select id="q">
    <option value="niedrig">Qualität: Niedrig</option>
    <option value="mittel">Qualität: Mittel</option>
    <option value="hoch">Qualität: Hoch</option>
    <option value="ultra">Qualität: Ultra</option>
  </select>
  <select id="api">
    <option value="gpu">Renderer: WebGPU</option>
    <option value="gl">Renderer: WebGL 2</option>
  </select>
  <button id="cam">Kamera: Fahrt</button>
  <button id="snd">🔇 Ton aus</button>
  <button id="bench">Benchmark (20 s)</button>
  <label>Sonnenstand <input id="sun" type="range" min="3" max="60" value="24"></label>
</div>
<div id="bm"></div>
<div id="res"><h2>Benchmark-Ergebnis</h2><pre id="rtext"></pre><button id="rcopy">Kopieren</button><button id="rclose">Schließen</button></div>

<script type="importmap">
{ "imports": {
  "three": "./lib/three.webgpu.js",
  "three/webgpu": "./lib/three.webgpu.js",
  "three/tsl": "./lib/three.tsl.js",
  "three/addons/": "./lib/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three/webgpu';
import { texture, positionWorld, positionLocal, uv, mix, smoothstep, vec2, vec3, vec4, float, normalWorld, time, sin, cos, instanceIndex, hash,
  normalMap, fract, abs, step, max, min, triplanarTexture, pass, mrt, output, screenUV, normalView, packNormalToRGB, unpackRGBToNormal, sample, renderOutput, uniform, clamp, pow } from 'three/tsl';
import { vertexColor } from 'three/tsl';
import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
import { WaterMesh } from 'three/addons/objects/WaterMesh.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { ao } from 'three/addons/tsl/display/GTAONode.js';
import { fxaa } from 'three/addons/tsl/display/FXAANode.js';

const T0 = performance.now();
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const mobile = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
const QN = P.get('q') || (mobile ? 'mittel' : 'hoch'); const START_U = +(P.get('u') || 0.02);
const WANT_GL = P.get('gl') === '1';
const Q = {
  niedrig: { pr: 1,   shadow: 1024, soft: false, grass: 12000,  trees: 420,  terr: 160, water: 'simple', post: 'none',  bloom: false, ao: false, aniso: 2 },
  mittel:  { pr: 1.5, shadow: 2048, soft: true,  grass: 40000,  trees: 900,  terr: 220, water: 0.25,     post: 'fxaa',  bloom: true,  ao: false, aniso: 4 },
  hoch:    { pr: 2,   shadow: 2048, soft: true,  grass: 90000,  trees: 1500,  terr: 300, water: 0.5,      post: 'fxaa',  bloom: true,  ao: true,  aniso: 8 },
  ultra:   { pr: 3,   shadow: 4096, soft: true,  grass: 180000, trees: 2400, terr: 400, water: 0.75,     post: 'fxaa',  bloom: true,  ao: true,  aniso: 16 },
}[QN] || null;
$('q').value = QN; $('api').value = WANT_GL ? 'gl' : 'gpu';
const go = (k, v) => { P.set(k, v); location.search = P.toString(); };
$('q').onchange = e => go('q', e.target.value);
$('api').onchange = e => go('gl', e.target.value === 'gl' ? '1' : '0');

const setLoad = (p, m) => { $('lbar').style.width = (p * 100).toFixed(0) + '%'; if (m) $('lmsg').textContent = m; };
const tick = () => new Promise(r => requestAnimationFrame(() => r()));

/* ---------- Zufall / Rauschen ---------- */
let seed = 7; const R = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const SN = new SimplexNoise({ random: R });
const fbm = (x, z, o = 5) => { let a = 0, f = 1, s = 0.5; for (let i = 0; i < o; i++) { a += s * SN.noise(x * f, z * f); f *= 2.03; s *= 0.5; } return a; };

/* ---------- Gelände, Fluss, Straße ---------- */
const riverZ = x => 255 + 28 * Math.sin(x / 140) + 12 * Math.sin(x / 53 + 1.3);
const WATER_Y = -2.2;
function baseH(x, z) {
  let h = 16 * fbm(x / 420, z / 420, 5) + 4 * fbm(x / 60, z / 60, 3);
  h += 22 * Math.exp(-((x + 40) ** 2 + (z + 30) ** 2) / (2 * 150 ** 2));            // Hügel in der Schleife
  const dr = Math.abs(z - riverZ(x));                                                   // Flusstal
  const bank = smooth(18, 70, dr);
  h = h * bank + (WATER_Y - 3.5) * (1 - smooth(10, 24, dr)) + (1 - bank) * smooth(10, 24, dr) * 1.0;
  if (z > riverZ(x) + 30) h += 10 * smooth(30, 160, z - riverZ(x));                    // anderes Ufer steigt an
  return h;
}
function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

// geschlossene Runde um den Hügel, Nordseite am Fluss entlang
const ctrl = [];
for (let i = 0; i < 14; i++) {
  const a = i / 14 * Math.PI * 2;
  let x = Math.cos(a) * 330 + 30 * Math.sin(a * 3), z = Math.sin(a) * 200 + 20 * Math.cos(a * 2) + 20;
  if (z > 150) z = Math.min(z, riverZ(x) - 34);
  ctrl.push(new THREE.Vector3(x, 0, z));
}
const curve = new THREE.CatmullRomCurve3(ctrl, true, 'centripetal');
const LEN = curve.getLength(), NS = Math.ceil(LEN / 1.0);
const RP = [], RT = [], RH = [];
for (let i = 0; i < NS; i++) { const u = i / NS; RP.push(curve.getPointAt(u)); RT.push(curve.getTangentAt(u)); }
for (let i = 0; i < NS; i++) { let s = 0, n = 0; for (const o of [-1.5, 0, 1.5]) { s += baseH(RP[i].x + RT[i].z * o, RP[i].z - RT[i].x * o); n++; } RH.push(s / n); }
for (let it = 0; it < 60; it++) { const c = RH.slice(); for (let i = 0; i < NS; i++) RH[i] = (c[(i - 3 + NS) % NS] + c[(i - 1 + NS) % NS] * 2 + c[i] * 3 + c[(i + 1) % NS] * 2 + c[(i + 3) % NS]) / 9; }
for (let i = 0; i < NS; i++) RH[i] = Math.max(RH[i], WATER_Y + 2.2);
// Raster für nächsten Straßenpunkt
const CELL = 24, GRID = new Map();
for (let i = 0; i < NS; i++) { const k = Math.floor(RP[i].x / CELL) + ',' + Math.floor(RP[i].z / CELL); (GRID.get(k) || GRID.set(k, []).get(k)).push(i); }
function nearRoad(x, z, rad = 60) {
  let best = 1e9, bi = -1; const r = Math.ceil(rad / CELL), cx = Math.floor(x / CELL), cz = Math.floor(z / CELL);
  for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) { const L = GRID.get((cx + a) + ',' + (cz + b)); if (!L) continue; for (const i of L) { const d = (RP[i].x - x) ** 2 + (RP[i].z - z) ** 2; if (d < best) { best = d; bi = i; } } }
  return { d: Math.sqrt(best), i: bi };
}
const RW = 7;
function H(x, z) {
  const h = baseH(x, z), n = nearRoad(x, z, 48);
  if (n.i < 0) return h;
  const k = smooth(RW / 2 + 1.5, RW / 2 + 22, n.d);
  return RH[n.i] - 0.12 + (h - RH[n.i] + 0.12) * k;
}

/* ---------- Renderer ---------- */
async function main() {
  setLoad(0.03, 'Initialisiere Renderer…');
  const renderer = new THREE.WebGPURenderer({ antialias: Q.post === 'none' && QN !== 'niedrig', forceWebGL: WANT_GL, powerPreference: 'high-performance' });
  await renderer.init();
  const isGPU = !!renderer.backend.isWebGPUBackend;
  $('be').textContent = isGPU ? 'WebGPU' : 'WebGL 2'; $('be').style.background = isGPU ? 'var(--ok)' : 'var(--warn)'; $('be').style.color = '#111';
  if (!isGPU && !WANT_GL) $('be').title = 'WebGPU nicht verfügbar, Fallback auf WebGL 2';
  try { if (navigator.gpu) { const ad = await navigator.gpu.requestAdapter(); const inf = ad && (ad.info || (ad.requestAdapterInfo && await ad.requestAdapterInfo())); if (inf) $('gpu').textContent = [inf.vendor, inf.architecture, inf.description].filter(Boolean).join(' ') || '–'; } } catch (e) {}
  if ($('gpu').textContent === '–') $('gpu').textContent = isGPU ? 'unbekannt' : 'WebGL';
  const PR = Math.min(devicePixelRatio || 1, Q.pr);
  renderer.setPixelRatio(PR); renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 0.85;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = Q.soft ? THREE.PCFShadowMap : THREE.BasicShadowMap;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 6000);
  scene.fog = new THREE.FogExp2(0xc4ccd2, 0.00026);

  /* Texturen */
  const TL = new THREE.TextureLoader(); const names = ['asphalt', 'wiese', 'waldboden', 'schotter', 'kiefer', 'eiche', 'sandstein_a', 'sandstein_b', 'moosfels', 'ufer'];
  const tex = {}; let done = 0; const total = names.length * 2 + 3;
  const loadT = (f, srgb) => new Promise((res, rej) => TL.load((f === 'water_n' ? 'tex/' : 'tex2/') + f + (/zweig/.test(f) ? '.webp' : '.jpg'), t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = Q.aniso; if (srgb) t.colorSpace = THREE.SRGBColorSpace; done++; setLoad(0.05 + 0.35 * done / total, 'Lade Texturen ' + done + '/' + total); res(t); }, undefined, rej));
  await Promise.all(names.flatMap(n => [loadT(n, true).then(t => tex[n] = t), loadT(n + '_n', false).then(t => tex[n + '_n'] = t)]).concat([loadT('water_n', false).then(t => tex.water_n = t), loadT('buche_zweig', true).then(t => tex.buche_zweig = t), loadT('kiefer_zweig', true).then(t => tex.kiefer_zweig = t)]));

  /* Himmel + Sonne */
  setLoad(0.42, 'Baue Himmel und Licht…'); await tick();
  const sky = new SkyMesh(); sky.scale.setScalar(5000);
  sky.turbidity.value = 3.2; sky.rayleigh.value = 1.6; sky.mieCoefficient.value = 0.004; sky.mieDirectionalG.value = 0.82;
  sky.cloudCoverage.value = 0.38; sky.cloudDensity.value = 0.45; sky.cloudElevation.value = 0.55;
  scene.add(sky);
  const sunDir = new THREE.Vector3();
  const sunL = new THREE.DirectionalLight(0xfff1dc, 3.2); sunL.castShadow = true;
  sunL.shadow.mapSize.set(Q.shadow, Q.shadow); const SC = 70;
  Object.assign(sunL.shadow.camera, { left: -SC, right: SC, top: SC, bottom: -SC, near: 1, far: 600 });
  sunL.shadow.bias = -0.0004; sunL.shadow.normalBias = 0.6; if (Q.soft) sunL.shadow.radius = 3;
  scene.add(sunL, sunL.target);
  const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x4a5a32, 0.25); scene.add(hemi);
  const pmrem = new THREE.PMREMGenerator(renderer); const envScene = new THREE.Scene(); const envSky = new SkyMesh(); envSky.scale.setScalar(1000); envSky.showSunDisc.value = 0; envScene.add(envSky);
  let envRT = null;
  function setSun(elev) {
    const phi = THREE.MathUtils.degToRad(90 - elev), th = THREE.MathUtils.degToRad(215);
    sunDir.setFromSphericalCoords(1, phi, th);
    sky.sunPosition.value.copy(sunDir); envSky.sunPosition.value.copy(sunDir);
    for (const k of ['turbidity', 'rayleigh', 'mieCoefficient', 'mieDirectionalG']) envSky[k].value = sky[k].value;
    const warm = smooth(4, 30, elev);
    sunL.color.setRGB(1, 0.72 + 0.26 * warm, 0.5 + 0.42 * warm); sunL.intensity = 2.2 + 3.4 * warm;
    hemi.intensity = 0.05 + 0.08 * warm; scene.environmentIntensity = 0.32 + 0.14 * warm;
    scene.fog.color.setRGB(0.70 + 0.10 * (1 - warm), 0.73, 0.74 - 0.10 * (1 - warm));
    if (water && water.sunDirection) water.sunDirection.value.copy(sunDir);
    if (envRT) envRT.dispose();
    envRT = pmrem.fromScene(envScene, 0, 0.1, 1000); scene.environment = envRT.texture;
  }

  /* Gelände */
  setLoad(0.48, 'Baue Gelände…'); await tick();
  const TS = 1500, TN = Q.terr;
  const tg = new THREE.PlaneGeometry(TS, TS, TN, TN); tg.rotateX(-Math.PI / 2);
  const tp = tg.attributes.position;
  for (let i = 0; i < tp.count; i++) { const x = tp.getX(i), z = tp.getZ(i); tp.setY(i, H(x, z)); }
  tg.computeVertexNormals();
  const wuv = positionWorld.xz;
  const sGrass = texture(tex.wiese, wuv.mul(0.5)), sGrassM = texture(tex.wiese, wuv.mul(0.043));
  const sForest = texture(tex.waldboden, wuv.mul(0.33)), sRock = texture(tex.sandstein_a, wuv.mul(0.16)), sGravel = texture(tex.ufer, wuv.mul(0.4));
  const macro = texture(tex.waldboden, wuv.mul(0.0045)).g;               // großflächige Variation gegen Kachelmuster
  const slope = smoothstep(0.93, 0.78, normalWorld.y);
  const forestMask = max(smoothstep(0.42, 0.62, macro.add(texture(tex.wiese, wuv.mul(0.009)).r.mul(0.4))), smoothstep(290.0, 325.0, positionWorld.z).mul(0.9));
  const wet = smoothstep(float(WATER_Y + 2.6), float(WATER_Y - 0.4), positionWorld.y);
  let tcol = mix(sGrass.rgb.mul(sGrassM.rgb.mul(1.2).add(0.45)).mul(vec3(0.9, 1.06, 0.72)), sForest.rgb, forestMask.mul(0.85));
  tcol = mix(tcol, sRock.rgb.mul(0.9), slope);
  tcol = mix(tcol, sGravel.rgb.mul(0.8), wet);
  const tmat = new THREE.MeshStandardNodeMaterial({ roughness: 0.96, metalness: 0 });
  const patch = texture(tex.waldboden, wuv.mul(0.0021)).r; const dry = smoothstep(0.35, 0.7, texture(tex.wiese, wuv.mul(0.0017)).r);
  tmat.colorNode = mix(tcol, tcol.mul(vec3(1.25, 1.12, 0.62)), dry.mul(0.45).mul(forestMask.oneMinus())).mul(macro.mul(0.6).add(0.7)).mul(patch.mul(0.5).add(0.78)).mul(0.84);
  tmat.normalNode = normalMap(mix(mix(texture(tex.wiese_n, wuv.mul(0.5)), texture(tex.waldboden_n, wuv.mul(0.33)), forestMask), texture(tex.ufer_n, wuv.mul(0.4)), wet), vec2(0.65));
  tmat.roughnessNode = mix(float(0.97), float(0.55), wet);
  const terrain = new THREE.Mesh(tg, tmat); terrain.receiveShadow = true; scene.add(terrain);
  /* Fernes Bergland rundherum (Horizont statt Kante), bewaldet, im Dunst */
  { const OS = 9000, ON = QN === 'niedrig' ? 96 : 180, og = new THREE.PlaneGeometry(OS, OS, ON, ON); og.rotateX(-Math.PI / 2); const op = og.attributes.position;
    for (let i = 0; i < op.count; i++) { const x = op.getX(i), z = op.getZ(i), r = Math.hypot(x, z); const k = smooth(640, 1900, r);
      let h = k * (60 + 190 * (0.5 + 0.5 * fbm(x / 900 + 7, z / 900 - 3, 5)) + 90 * Math.max(0, fbm(x / 2600, z / 2600, 3)));
      if (r < 760) h = Math.min(h, H(THREE.MathUtils.clamp(x, -749, 749), THREE.MathUtils.clamp(z, -749, 749)) - 3); op.setY(i, h); }
    og.computeVertexNormals();
    const om = new THREE.MeshStandardNodeMaterial({ roughness: 1 });
    const fw = texture(tex.waldboden, positionWorld.xz.mul(0.002)).rgb, fn = texture(tex.wiese, positionWorld.xz.mul(0.0011)).g;
    const forestCol = mix(vec3(0.035, 0.06, 0.03), vec3(0.07, 0.1, 0.045), fn).mul(fw.mul(0.6).add(0.7));
    const rockCol = texture(tex.sandstein_a, positionWorld.xz.mul(0.004)).rgb.mul(0.7);
    om.colorNode = mix(forestCol, rockCol, smoothstep(0.82, 0.62, normalWorld.y));
    const outer = new THREE.Mesh(og, om); outer.position.y = -0.5; outer.receiveShadow = false; scene.add(outer); }

  /* Straße */
  setLoad(0.55, 'Baue Straße…'); await tick();
  function ribbon(w, dy, vScale) {
    const pos = [], uvs = [], idx = [];
    for (let i = 0; i <= NS; i++) { const j = i % NS, p = RP[j], t = RT[j], nx = t.z, nz = -t.x; const l = Math.hypot(nx, nz);
      for (const s of [-1, 1]) { pos.push(p.x + nx / l * s * w / 2, RH[j] + dy, p.z + nz / l * s * w / 2); uvs.push((s + 1) / 2, i * (LEN / NS) / vScale); } }
    for (let i = 0; i < NS; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2)); g.setIndex(idx); g.computeVertexNormals();
    if (g.attributes.normal.getY(0) < 0) { g.index.array.reverse(); g.computeVertexNormals(); }
    return g;
  }
  const ru = uv();
  const along = ru.y.mul(7.0);
  const edgeL = step(float(0.035), ru.x).oneMinus().add(step(float(0.965), ru.x)).mul(step(ru.x, float(0.055)).add(step(float(0.945), ru.x)));
  const edge = smoothstep(0.045, 0.035, ru.x).add(smoothstep(0.955, 0.965, ru.x)).sub(smoothstep(0.03, 0.02, ru.x)).sub(smoothstep(0.97, 0.98, ru.x));

    L.forEach((t, i) => { q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), t.r);
      m.compose(new THREE.Vector3(t.x, t.y - 0.3, t.z), q, s.set(t.hgt * 0.028, kind ? t.hgt * 0.62 : t.hgt * 0.92, t.hgt * 0.028)); trunks.setMatrixAt(i, m);
      if (kind) m.compose(new THREE.Vector3(t.x, t.y + t.hgt - t.w * 1.15 * 1.05, t.z), q, s.set(t.w, t.w * 1.15, t.w));
      else m.compose(new THREE.Vector3(t.x, t.y + t.hgt * 0.3, t.z), q, s.set(t.w, t.hgt * 0.72, t.w));
      crowns.setMatrixAt(i, m); });
    trunks.castShadow = crowns.castShadow = true; trunks.receiveShadow = crowns.receiveShadow = true; scene.add(trunks, crowns);
  }

  /* Gras */
  setLoad(0.82, 'Säe Gras…'); await tick();
  const bladeG = (() => { const pos = [], uvs = [], idx = [], nor = []; const B = 12;
    for (let b = 0; b < B; b++) { const a = R() * Math.PI, ox = (R() - 0.5) * 0.5, oz = (R() - 0.5) * 0.5, h = 0.16 + R() * 0.3, w = 0.018 + R() * 0.012, lean = (R() - 0.5) * 0.35, base = pos.length / 3;
      for (let s = 0; s <= 3; s++) { const t = s / 3, ww = w * (1 - t * 0.85); const cx = ox + Math.cos(a + 1.57) * lean * t * t, cz = oz + Math.sin(a + 1.57) * lean * t * t;
        for (const sd of [-1, 1]) { pos.push(cx + Math.cos(a) * ww * sd, t * h, cz + Math.sin(a) * ww * sd); uvs.push((sd + 1) / 2, t); nor.push(Math.cos(a + 1.57) * 0.35, 1, Math.sin(a + 1.57) * 0.35); } }
      for (let s = 0; s < 3; s++) { const q = base + s * 2; idx.push(q, q + 1, q + 2, q + 1, q + 3, q + 2); } }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.normalizeNormals(); g.setIndex(idx); return g; })();
  const grassM = new THREE.MeshStandardNodeMaterial({ side: THREE.DoubleSide, roughness: 0.75 });
  const gh = hash(instanceIndex.add(17)), gy = uv().y;
  const gw = positionWorld.xz;
  const wind = sin(time.mul(1.9).add(gw.x.mul(0.21)).add(gw.y.mul(0.13))).add(sin(time.mul(3.1).add(gw.x.mul(0.6))).mul(0.35)).mul(gy.mul(gy)).mul(0.09);
  grassM.positionNode = positionLocal.add(vec3(wind, 0, wind.mul(0.5)));
  grassM.colorNode = mix(vec3(0.03, 0.07, 0.015), mix(vec3(0.17, 0.27, 0.06), vec3(0.36, 0.38, 0.13), gh.mul(gh)), gy).mul(texture(tex.wiese, gw.mul(0.043)).rgb.mul(1.3).add(0.35));
  const grass = new THREE.InstancedMesh(bladeG, grassM, Q.grass);
  { const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(); let k = 0;
    for (let n = 0; k < Q.grass && n < Q.grass * 3; n++) { const i = Math.floor(R() * NS), side = R() < 0.5 ? -1 : 1, off = RW / 2 + 1.7 + R() ** 2.4 * 32; const x = RP[i].x + RT[i].z * side * off + (R() - 0.5) * 1.5, z = RP[i].z - RT[i].x * side * off + (R() - 0.5) * 1.5;
      const y = H(x, z); if (y < WATER_Y + 0.6) continue; const sc = 0.65 + R() * 0.55; q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), R() * 6.28); m.compose(new THREE.Vector3(x, y - 0.05, z), q, s.set(sc, sc * (0.8 + R() * 0.6), sc)); grass.setMatrixAt(k++, m); }
    grass.count = k; }
  grass.receiveShadow = true; grass.frustumCulled = false; scene.add(grass);
  /* Wiesenblumen in Gruppen: Margerite, Hahnenfuß, Flockenblume, Kornblume, Klee */
  { const st = new THREE.CylinderGeometry(0.006, 0.009, 1, 3, 1, true); st.translate(0, 0.5, 0);
    const hd = new THREE.CylinderGeometry(0.075, 0.03, 0.025, 8); hd.translate(0, 1.0, 0);
    const ctr = new THREE.SphereGeometry(0.028, 5, 3); ctr.translate(0, 1.015, 0);
    const parts = [st, hd, ctr], cols = [[0.25, 0.42, 0.12], [1, 1, 1], [0.95, 0.75, 0.1]];
    const pos = [], nor = [], col = [], idx = []; let off = 0;
    parts.forEach((g, pi) => { const gi = g.toNonIndexed(); const P = gi.attributes.position, N = gi.attributes.normal; for (let i = 0; i < P.count; i++) { pos.push(P.getX(i), P.getY(i), P.getZ(i)); nor.push(N.getX(i), N.getY(i), N.getZ(i)); col.push(...cols[pi]); } });
    const fg = new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); fg.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); fg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const fsway = vec3(sin(time.mul(2.1).add(hash(instanceIndex).mul(40))).mul(0.03).mul(positionLocal.y), 0, 0);
    const FC = [[0.97, 0.97, 0.93], [1.0, 0.86, 0.12], [0.62, 0.3, 0.75], [0.3, 0.45, 0.95], [0.9, 0.55, 0.7]];
    const NF = Math.round(Q.grass / 6 / FC.length);
    const FL = FC.map(fc => { const fm = new THREE.MeshStandardNodeMaterial({ roughness: 0.6, vertexColors: true, side: THREE.DoubleSide });
      fm.colorNode = mix(vertexColor(), vec3(fc[0], fc[1], fc[2]), step(0.99, vertexColor().b)); fm.positionNode = positionLocal.add(fsway);
      const im = new THREE.InstancedMesh(fg, fm, NF); im.k = 0; return im; });
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc3 = new THREE.Vector3();
    for (let n = 0; n < NF * 2; n++) {
      const i = Math.floor(R() * NS), side = R() < 0.5 ? -1 : 1, offc = RW / 2 + 2.5 + R() ** 1.6 * 22; const cx = RP[i].x + RT[i].z * side * offc, cz = RP[i].z - RT[i].x * side * offc;
      const flowers = FL[Math.floor(R() * FL.length)], cnt = 6 + Math.floor(R() * 26); if (flowers.k >= NF) continue;
      for (let j = 0; j < cnt && flowers.k < NF; j++) { const a = R() * 6.28, rr = R() ** 0.7 * 3.5, x = cx + Math.cos(a) * rr, z = cz + Math.sin(a) * rr;
        if (nearRoad(x, z, 12).d < RW / 2 + 1.8) continue; const y = H(x, z); if (y < WATER_Y + 0.8) continue;
        const h = 0.25 + R() * 0.45, w = 0.8 + R() * 0.6; q.setFromEuler(new THREE.Euler((R() - 0.5) * 0.35, R() * 6.28, (R() - 0.5) * 0.35)); m.compose(new THREE.Vector3(x, y - 0.02, z), q, sc3.set(w, h, w));
        flowers.setMatrixAt(flowers.k++, m); } }
    for (const flowers of FL) { flowers.count = flowers.k; flowers.receiveShadow = true; flowers.frustumCulled = false; scene.add(flowers); } }

  /* Postprocessing */
  setLoad(0.88, 'Richte Effekte ein…'); await tick();
  let pipeline = null;
  try {
    if (Q.post !== 'none') {
      pipeline = new THREE.RenderPipeline(renderer);
      const sp = pass(scene, camera);
      let col;
      if (Q.ao) {
        sp.setMRT(mrt({ output, normal: packNormalToRGB(normalView) }));
        const nT = sp.getTextureNode('normal');
        const aoP = ao(sp.getTextureNode('depth'), sample(u => unpackRGBToNormal(nT.sample(u))), camera); aoP.resolutionScale = 0.5; aoP.radius.value = 0.6; aoP.thickness.value = 1.0;
        col = vec4(sp.getTextureNode('output').rgb.mul(mix(float(1), aoP.getTextureNode().r, 0.85)), 1);
      } else col = sp.getTextureNode('output');
      if (Q.bloom) { const bl = bloom(col, 0.05, 0.12, 2.6); col = col.add(bl); }
      pipeline.outputColorTransform = false;
      // leichte Farbkorrektur nach dem Tonemapping: mehr Kontrast und Sättigung, sanfte Vignette
      const ro = renderOutput(col), cg = ro.rgb.sub(0.5).mul(1.1).add(0.5);
      const lum = cg.dot(vec3(0.2126, 0.7152, 0.0722)), sat = mix(vec3(lum), cg, 1.12);
      const vig = smoothstep(1.15, 0.35, screenUV.sub(0.5).length().mul(1.6));
      pipeline.outputNode = fxaa(vec4(clamp(sat.mul(vig.mul(0.18).add(0.82)), 0, 1), 1));
    }
  } catch (e) { console.warn('Postprocessing aus:', e); pipeline = null; }

  /* Kamera */
  const controls = new OrbitControls(camera, renderer.domElement); controls.enabled = false; controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495;
  let ride = true, u = START_U, speed = 10.5; // m/s
  $('cam').onclick = () => { ride = !ride; controls.enabled = !ride; $('cam').textContent = 'Kamera: ' + (ride ? 'Fahrt' : 'Frei'); $('cam').classList.toggle('on', !ride); if (!ride) { controls.target.copy(camera.position).add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(20)); } };
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
  function placeCam(dt) {
    u = (u + dt * speed / LEN) % 1;
    const i = Math.floor(u * NS) % NS, f = u * NS - Math.floor(u * NS), j = (i + 1) % NS;
    tmpA.copy(RP[i]).lerp(RP[j], f); const t = RT[i];
    const y = RH[i] + (RH[j] - RH[i]) * f;
    camera.position.set(tmpA.x - t.z * 1.2, y + 1.55, tmpA.z + t.x * 1.2);
    const la = (i + 14) % NS; tmpB.set(RP[la].x - RT[la].z * 1.2, RH[la] + 1.25, RP[la].z + RT[la].x * 1.2);
    camera.lookAt(tmpB);
  }

  /* Umgebungston: Fluss (nach Abstand), Laub/Wind, Fahrtwind (nach Tempo), Vögel nur nahe Bäumen */
  const AUD = { ctx: null, on: false, buf: {}, loops: {} };
  async function audioInit() {
    const C = new (window.AudioContext || window.webkitAudioContext)(); AUD.ctx = C; AUD.master = C.createGain(); AUD.master.gain.value = 0.9; AUD.master.connect(C.destination);
    const names = ['bach', 'laub', 'fahrtwind', 'amsel', 'fink', 'meise', 'lerche', 'kuckuck', 'greifvogel'];
    await Promise.all(names.map(async n => { try { const r = await fetch('sfx/' + n + '.mp3'); AUD.buf[n] = await C.decodeAudioData(await r.arrayBuffer()); } catch (e) {} }));
    for (const n of ['bach', 'laub', 'fahrtwind']) { if (!AUD.buf[n]) continue; const src = C.createBufferSource(); src.buffer = AUD.buf[n]; src.loop = true; const g = C.createGain(); g.gain.value = 0; src.connect(g).connect(AUD.master); src.start(0, Math.random() * 3); AUD.loops[n] = g; }
  }
  let birdT = 3;
  function audioStep(dt) {
    if (!AUD.on || !AUD.ctx) return; const C = AUD.ctx, p = camera.position, t = C.currentTime;
    const dRiver = Math.abs(p.z - riverZ(p.x));
    const set = (n, v) => { if (AUD.loops[n]) AUD.loops[n].gain.setTargetAtTime(v, t, 0.4); };
    set('bach', 0.55 * Math.max(0, 1 - dRiver / 90) ** 1.5);
    set('laub', 0.18 + 0.12 * Math.max(0, Math.sin(t * 0.13)));
    set('fahrtwind', ride ? 0.1 + 0.025 * speed : 0);
    birdT -= dt; if (birdT < 0) { birdT = 2.5 + Math.random() * 7;
      let near = 0; for (let k = 0; k < 40; k++) { const tr = TREES[(Math.random() * TREES.length) | 0]; if (Math.hypot(tr.x - p.x, tr.z - p.z) < 60) near++; }
      if (near) { const pool = ['amsel', 'fink', 'meise', 'amsel', 'fink', 'lerche', 'kuckuck', 'greifvogel'], n = pool[(Math.random() * pool.length) | 0]; const b = AUD.buf[n]; if (b) {
        const src = C.createBufferSource(); src.buffer = b; src.playbackRate.value = 0.94 + Math.random() * 0.12; const g = C.createGain(); g.gain.value = 0.12 + Math.random() * 0.2;
        const pan = C.createStereoPanner ? C.createStereoPanner() : null; if (pan) { pan.pan.value = Math.random() * 1.6 - 0.8; src.connect(g).connect(pan).connect(AUD.master); } else src.connect(g).connect(AUD.master); src.start(); } } }
  }
  $('snd').onclick = async () => { if (!AUD.ctx) { $('snd').textContent = '⏳ Lade Ton…'; await audioInit(); } AUD.on = !AUD.on; if (AUD.on) AUD.ctx.resume(); else AUD.ctx.suspend(); $('snd').textContent = AUD.on ? '🔊 Ton an' : '🔇 Ton aus'; $('snd').classList.toggle('on', AUD.on); };

  setSun(+$('sun').value);
  let sunT = 0; $('sun').oninput = () => { clearTimeout(sunT); sky.sunPosition.value.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - $('sun').value), THREE.MathUtils.degToRad(215)); sunT = setTimeout(() => setSun(+$('sun').value), 120); };

  /* Shader vorkompilieren */
  setLoad(0.92, 'Kompiliere Shader (kann auf dem Handy dauern)…'); await tick();
  placeCam(0);
  try { await renderer.compileAsync(scene, camera); } catch (e) {}

  /* Loop + Messung */
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); updRes(); });
  const updRes = () => { $('rs').textContent = Math.round(innerWidth * PR) + '×' + Math.round(innerHeight * PR) + ' @' + PR.toFixed(2).replace(/\.?0+$/, ''); };
  updRes(); $('ql').textContent = { niedrig: 'Niedrig', mittel: 'Mittel', hoch: 'Hoch', ultra: 'Ultra' }[QN];
  let last = performance.now(), acc = 0, frames = 0, first = true;
  const FT = []; let bench = null;
  const clock = new THREE.Timer ? null : null;
  renderer.setAnimationLoop(() => {
    const now = performance.now(), dtms = now - last; last = now; const dt = Math.min(0.1, dtms / 1000);
    if (ride) placeCam(dt); else controls.update();
    audioStep(dt);
    sunL.position.copy(camera.position).addScaledVector(sunDir, 300); sunL.target.position.copy(camera.position); sunL.target.updateMatrixWorld();
    if (pipeline) pipeline.render(); else renderer.render(scene, camera);
    if (first) { first = false; $('lt').textContent = ((performance.now() - T0) / 1000).toFixed(1) + ' s'; $('load').style.display = 'none'; return; }
    acc += dtms; frames++; FT.push(dtms); if (FT.length > 600) FT.shift();
    if (bench) { bench.t.push(dtms); const left = Math.max(0, bench.end - now); $('bm').textContent = 'Benchmark läuft… ' + Math.ceil(left / 1000) + ' s'; if (now >= bench.end) finishBench(); }
    if (acc > 500) { $('fps').textContent = (frames * 1000 / acc).toFixed(0); $('ms').textContent = (acc / frames).toFixed(1) + ' ms';
      const inf = renderer.info.render; $('tri').textContent = fmt(inf.triangles); $('dc').textContent = inf.drawCalls ?? inf.calls ?? '–'; acc = 0; frames = 0; }
  });
  const fmt = n => n > 1e6 ? (n / 1e6).toFixed(2) + ' Mio' : n > 1e3 ? (n / 1e3).toFixed(0) + ' Tsd' : n;
  $('bench').onclick = () => { if (bench) return; ride = true; controls.enabled = false; $('cam').textContent = 'Kamera: Fahrt'; $('cam').classList.remove('on'); u = 0.02; bench = { t: [], end: performance.now() + 20000 }; $('bm').style.display = 'block'; };
  function finishBench() {
    const t = bench.t.slice(5).sort((a, b) => a - b); bench = null; $('bm').style.display = 'none';
    const avg = t.reduce((a, b) => a + b, 0) / t.length, p99 = t[Math.floor(t.length * 0.99)], med = t[Math.floor(t.length / 2)];
    const txt = [
      'Ø FPS:        ' + (1000 / avg).toFixed(1),
      'Median:       ' + (1000 / med).toFixed(1) + ' FPS (' + med.toFixed(1) + ' ms)',
      '1 % Low:      ' + (1000 / p99).toFixed(1) + ' FPS (' + p99.toFixed(1) + ' ms)',
      'Renderer:     ' + (isGPU ? 'WebGPU' : 'WebGL 2'),
      'Qualität:     ' + $('ql').textContent,
      'Auflösung:    ' + $('rs').textContent,
      'Dreiecke:     ' + $('tri').textContent,
      'Ladezeit:     ' + $('lt').textContent,
      'GPU:          ' + $('gpu').textContent,
      'Gerät:        ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 140),
    ].join('\n');
    $('rtext').textContent = txt; $('res').style.display = 'block';
  }
  $('rclose').onclick = () => $('res').style.display = 'none';
  $('rcopy').onclick = async () => { try { await navigator.clipboard.writeText($('rtext').textContent); $('rcopy').textContent = 'Kopiert ✓'; } catch (e) { $('rcopy').textContent = 'Kopieren ging nicht'; } };
  window.__look = (a, b) => { ride = false; controls.enabled = true; camera.position.set(...a); controls.target.set(...b); controls.update(); };
  window.__STATE = () => ({ isGPU, q: QN, tris: renderer.info.render.triangles, trees: TREES.length, grass: grass.count, pipeline: !!pipeline });
}
main().catch(e => { console.error(e); $('lmsg').textContent = 'Fehler: ' + (e && e.message || e); $('lmsg').style.color = '#ff8080'; });
</script>
